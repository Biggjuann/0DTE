name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strategy tests
        run: python tests/test_strategy.py

      - name: Smoke-test the app boots (mock mode)
        env:
          DATA_MODE: mock
        run: |
          python -c "from app.server import app, engine; print('app + engine import OK')"
