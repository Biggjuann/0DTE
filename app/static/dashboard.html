<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>0DTE · Long-Only Auto-Trader</title>
<style>
  :root{
    --bg:#070b14; --panel:#0d1320; --panel2:#111a2b; --line:#1c2740;
    --txt:#e6edf7; --muted:#7e8aa3; --dim:#56627d;
    --teal:#22d3b7; --green:#34d399; --red:#f87171; --amber:#fbbf24;
    --blue:#38bdf8; --violet:#a78bfa;
    --glow:0 0 0 1px rgba(34,211,183,.18), 0 8px 40px -12px rgba(34,211,183,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#0e1830 0%,var(--bg) 55%);
    color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  a{color:inherit}
  /* top bar */
  header{display:flex;align-items:center;gap:18px;padding:14px 22px;
    border-bottom:1px solid var(--line);background:rgba(8,12,22,.7);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:10}
  .brand{font-weight:800;letter-spacing:.5px;font-size:18px}
  .brand b{color:var(--teal)}
  .badge{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
    white-space:nowrap}
  #sessionBadge{border-radius:8px}
  .badge.live{color:#04140f;background:var(--green);border-color:transparent}
  .badge.mock{color:var(--blue);border-color:rgba(56,189,248,.35)}
  .badge.dry{color:var(--amber);border-color:rgba(251,191,36,.35)}
  .badge.armed-real{color:#170707;background:var(--red);border-color:transparent}
  .badge.sess-open{color:#04140f;background:var(--green);border-color:transparent}
  .badge.sess-soon{color:var(--amber);border-color:rgba(251,191,36,.35)}
  .badge.sess-closed{color:var(--muted);border-color:var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--dim)}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .spacer{flex:1}
  .btn{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--txt);
    background:var(--panel2);border:1px solid var(--line);padding:7px 13px;border-radius:8px;
    transition:.15s}
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn.kill:hover{border-color:var(--red);color:var(--red)}
  .clock{color:var(--muted);font-size:12px}
  /* tabs */
  .tabbar{display:flex;gap:6px;padding:14px 22px 0;max-width:1500px;margin:0 auto}
  .tab{cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--muted);
    background:transparent;border:1px solid var(--line);border-bottom:none;
    padding:10px 18px;border-radius:10px 10px 0 0;transition:.15s}
  .tab.active{color:var(--teal);background:var(--panel);border-color:rgba(34,211,183,.3)}
  .tab:hover{color:var(--txt)}
  /* pivot bits */
  .b-bear{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3)}
  .b-bull{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .zoneinfo{background:rgba(56,189,248,.10);color:var(--blue);border:1px solid rgba(56,189,248,.3);
    font-size:12px;line-height:1.4}
  .rung.res{border-color:rgba(248,113,113,.45)} .rlab.res b{color:var(--red)}
  .rung.piv{border-color:rgba(167,139,250,.7)} .rlab.piv b{color:var(--violet)}
  .rung.sup{border-color:rgba(52,211,153,.45)} .rlab.sup b{color:var(--green)}
  /* pivot ZONES (bands centered on each level) */
  .zone{position:absolute;left:0;right:0;border-radius:3px;pointer-events:none}
  .zone.res{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.28)}
  .zone.piv{background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4)}
  .zone.sup{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.28)}
  .znote{position:absolute;left:6px;bottom:2px;font-size:9px;letter-spacing:.3px;
    color:var(--dim);text-transform:uppercase}
  .rlab.key b{text-shadow:0 0 8px currentColor}
  .pill2{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;margin-left:6px}
  .pill-short{background:rgba(248,113,113,.15);color:var(--red)}
  .pill-long{background:rgba(52,211,153,.15);color:var(--green)}
  .pill-scaled{background:rgba(56,189,248,.15);color:var(--blue)}
  .pill-be{background:rgba(251,191,36,.15);color:var(--amber)}
  /* layout */
  main{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat .k{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:26px;font-weight:800;margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
  /* phones */
  @media(max-width:680px){
    header{gap:7px 9px;padding:9px 12px;flex-wrap:wrap}
    .brand{font-size:16px}
    .badge{font-size:10px;padding:3px 7px;letter-spacing:.3px}
    #srcTxt{display:none}
    .clock{font-size:11px}
    header .btn{padding:6px 9px;font-size:11px}
    .tabbar{padding:12px 12px 0;gap:5px}
    .tab{padding:9px 13px;font-size:12px}
    main{padding:14px 12px 48px}
    .summary{gap:10px;margin-bottom:16px}
    .stat{padding:11px 12px;border-radius:12px}
    .stat .v{font-size:20px}
    .stat .k{font-size:10px}
    .grid{gap:14px}
    .card{padding:14px;border-radius:14px}
    .chead{flex-wrap:wrap;gap:8px}
    .tkr,.price{font-size:19px}
    .banner{font-size:12px;padding:8px 10px}
    .flowrow{font-size:11px;gap:8px}
    .flowrow .lbl{width:92px}
    .flowrow .num{width:56px}
    .pos .row{font-size:12px}
    .targets{flex-wrap:wrap}
    .tlog{padding:14px;overflow-x:auto}
    .tlog h3{flex-wrap:wrap;gap:8px}
    .tlog table{min-width:560px}
  }
  /* small phones */
  @media(max-width:380px){
    .summary{grid-template-columns:1fr 1fr;gap:8px}
    .stat .v{font-size:18px}
    .tkr,.price{font-size:17px}
  }
  /* ticker card */
  .card{background:linear-gradient(180deg,var(--panel) 0%,#0a1019 100%);
    border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}
  .card.open{box-shadow:var(--glow);border-color:rgba(34,211,183,.3)}
  .chead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .tkr{font-size:22px;font-weight:800;letter-spacing:.5px}
  .price{font-size:22px;font-weight:800}
  .state-pill{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    padding:4px 10px;border-radius:999px}
  .st-open{background:rgba(34,211,183,.15);color:var(--teal);border:1px solid rgba(34,211,183,.4)}
  .st-armed{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.35)}
  .st-disabled{background:rgba(126,138,163,.1);color:var(--muted);border:1px solid var(--line)}
  .banner{margin:12px 0;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px;
    display:flex;align-items:center;gap:8px}
  .b-long{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .b-caution{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
  .b-off{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.3)}
  /* level ladder */
  .ladder{position:relative;height:172px;margin:14px 0 6px;border-left:2px solid var(--line)}
  .rung{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
  .rung.top{border-color:rgba(52,211,153,.55)}
  .rung.mid{border-color:rgba(167,139,250,.55)}
  .rung.low{border-color:rgba(248,113,113,.55)}
  .rlab{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    transform:translateY(50%);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;pointer-events:none}
  .rlab span{color:var(--muted);background:var(--panel);padding:0 6px}
  .rlab b{background:var(--panel);padding:0 6px;font-weight:800}
  .rlab.top b{color:var(--green)} .rlab.mid b{color:var(--violet)} .rlab.low b{color:var(--red)}
  .fresh{font-size:10px;font-weight:700;color:var(--green);border:1px solid rgba(52,211,153,.4);
    border-radius:6px;padding:1px 6px;margin-left:8px}
  .fresh.stale{color:var(--red);border-color:rgba(248,113,113,.45)}
  .lvsrc{position:absolute;left:6px;top:-2px;font-size:10px;letter-spacing:.4px;
    text-transform:uppercase;color:var(--dim)}
  .pxmark{position:absolute;right:0;left:0;height:2px;background:var(--teal);
    box-shadow:0 0 10px var(--teal);transition:bottom .6s ease}
  .pxmark .tag{position:absolute;right:6px;top:-20px;font-size:11px;font-weight:800;color:var(--teal);
    background:var(--panel2);padding:1px 7px;border-radius:6px;border:1px solid rgba(34,211,183,.4)}
  .near{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  /* flow */
  .flow{margin-top:10px}
  .flowrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px}
  .flowrow .lbl{width:120px;color:var(--muted)}
  .bar{flex:1;height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px}
  .bar.p i{background:linear-gradient(90deg,#f8717155,var(--red))}
  .bar.c i{background:linear-gradient(90deg,#34d39955,var(--green))}
  .flowrow .num{width:90px;text-align:right;font-weight:700}
  .ctrl{font-size:12px;font-weight:800;letter-spacing:.5px;margin-top:8px}
  .ctrl.bull{color:var(--green)} .ctrl.bear{color:var(--red)}
  /* position */
  .pos{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .pos .row{display:flex;justify-content:space-between;margin:3px 0;font-size:13px}
  .pos .row span:first-child{color:var(--muted)}
  .pnl-pos{color:var(--green)} .pnl-neg{color:var(--red)}
  .targets{display:flex;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}
  .targets b{color:var(--txt)}
  /* events */
  .events{margin-top:12px;max-height:120px;overflow:auto;font-size:11.5px;color:var(--dim)}
  .events div{padding:2px 0;border-bottom:1px solid rgba(28,39,64,.5)}
  .events .mono{color:var(--muted)}
  /* trade log */
  .tlog{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .tlog h3{margin:0 0 12px;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);
    font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  td{padding:7px 10px;border-bottom:1px solid rgba(28,39,64,.5)}
  .tag-entry{color:var(--blue);font-weight:700}
  .tag-exit{color:var(--amber);font-weight:700}
  .mini{font-size:10px;color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:1px 5px;border-radius:5px}
  .muted{color:var(--muted)}
  .empty{color:var(--dim);text-align:center;padding:18px}
</style>
</head>
<body>
<header>
  <div class="brand">0<b>DTE</b></div>
  <span class="badge" id="modeBadge">—</span>
  <span class="badge" id="dryBadge">—</span>
  <span class="badge" id="sessionBadge" title="0DTE trade only during the regular session">—</span>
  <span class="clock"><span class="dot" id="runDot"></span><span id="runTxt">—</span></span>
  <span class="clock" id="srcTxt" style="font-size:11px"></span>
  <div class="spacer"></div>
  <span class="clock mono" id="clock">--:--:--</span>
  <button class="btn" onclick="ctl('start')">Start</button>
  <button class="btn" onclick="ctl('stop')">Stop</button>
  <button class="btn" id="autoBtn" onclick="toggleAuto()">Auto: —</button>
  <button class="btn kill" onclick="if(confirm('Flatten all & halt trading?'))ctl('kill')">Kill</button>
</header>

<div class="tabbar">
  <button class="tab active" id="tabbtn-gamma" onclick="switchTab('gamma')">Gamma Levels</button>
  <button class="tab" id="tabbtn-pivot" onclick="switchTab('pivot')">Person's Pivots</button>
</div>

<main>
  <section id="tab-gamma">
    <div class="summary" id="summary"></div>
    <div class="grid" id="cards"></div>
    <div class="tlog">
      <h3 style="display:flex;align-items:center;gap:12px">Trade Log
        <span class="spacer" style="flex:1"></span>
        <span id="exitTypes" class="muted" style="font-size:11px;letter-spacing:0;text-transform:none"></span>
        <a class="btn" href="/api/trades.csv" download style="text-decoration:none">⬇ Download CSV</a>
        <button class="btn kill" onclick="clearLog()">Clear log</button>
      </h3>
      <table>
        <thead><tr><th>Time</th><th>Ticker</th><th>Action</th><th>Contract</th><th>Strike</th>
          <th>Qty</th><th>Price</th><th>P&amp;L</th><th>Reason</th></tr></thead>
        <tbody id="tlog"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-pivot" style="display:none">
    <div class="banner" id="pivotRegime" style="margin-bottom:18px">VIX regime…</div>
    <div class="summary" id="psummary"></div>
    <div class="grid" id="pcards"></div>
    <div class="tlog">
      <h3 style="display:flex;align-items:center;gap:12px">Pivot Trade Log
        <span class="spacer" style="flex:1"></span>
        <span id="pexitTypes" class="muted" style="font-size:11px;letter-spacing:0;text-transform:none"></span>
        <a class="btn" href="/api/pivot/trades.csv" download style="text-decoration:none">⬇ Download CSV</a>
        <button class="btn kill" onclick="clearLog()">Clear log</button>
      </h3>
      <table>
        <thead><tr><th>Time</th><th>Ticker</th><th>Action</th><th>Contract</th><th>Strike</th>
          <th>Qty</th><th>Price</th><th>P&amp;L</th><th>Reason</th></tr></thead>
        <tbody id="ptlog"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
let AUTO=true, activeTab='gamma';
const fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>n==null?'—':(n<0?'-$':'$')+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const k=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0);
const apiBase=()=>activeTab==='pivot'?'/api/pivot/control/':'/api/control/';

function switchTab(t){
  activeTab=t;
  document.getElementById('tab-gamma').style.display=t==='gamma'?'':'none';
  document.getElementById('tab-pivot').style.display=t==='pivot'?'':'none';
  document.getElementById('tabbtn-gamma').classList.toggle('active',t==='gamma');
  document.getElementById('tabbtn-pivot').classList.toggle('active',t==='pivot');
  updateHeader();
}
async function ctl(a){await fetch(apiBase()+a,{method:'POST'});setTimeout(refresh,150);}
function toggleAuto(){ctl(AUTO?'auto_off':'auto_on');}
async function clearLog(){
  const name=activeTab==='pivot'?'pivot':'gamma-levels';
  if(!confirm('Clear the '+name+' trade log? This cannot be undone.')) return;
  const r=await fetch(apiBase()+'clear_trades',{method:'POST'});
  const j=await r.json(); alert('Cleared '+(j.cleared||0)+' records'); refresh();
}

function updateHeader(){
  const s=activeTab==='pivot'?window.pivotSnap:window.gammaSnap;
  if(!s) return;
  AUTO=s.auto_trade;
  document.getElementById('srcTxt').textContent=
    activeTab==='pivot'?`· pivots: ${s.mode==='live'?'schwab':'mock'}`:(window.gammaSrc||'');
  const mb=document.getElementById('modeBadge');
  mb.textContent=s.mode; mb.className='badge '+(s.mode==='live'?'live':'mock');
  const dry=document.getElementById('dryBadge');
  dry.textContent=s.dry_run?'DRY RUN':'LIVE ORDERS';
  dry.className='badge '+(s.dry_run?'dry':'armed-real');
  document.getElementById('runDot').className='dot'+(s.running?' on':'');
  document.getElementById('runTxt').textContent=s.running?'engine running':'stopped';
  document.getElementById('autoBtn').textContent='Auto: '+(s.auto_trade?'ON':'OFF');
  const sb=document.getElementById('sessionBadge'), se=s.session;
  if(se){
    const ph=se.phase;
    const cls=ph==='open'?'sess-open':(ph==='late'||ph==='flatten')?'sess-soon':'sess-closed';
    const txt=ph==='open'?'RTH OPEN':ph==='late'?'RTH · NO ENTRY':ph==='flatten'?'RTH · FLATTEN':
              ph==='pre'?'PRE-MARKET':'CLOSED';
    sb.className='badge '+cls;
    sb.textContent=`${txt} ${se.label}`;
    sb.style.display=se.rth_only?'':'none';
  } else sb.style.display='none';
}

function statusBanner(mm){
  if(!mm) return {cls:'b-off',txt:'No MM signal'};
  const s=mm.status;
  if(s==='long') return {cls:'b-long',txt:'LONG — bias confirmed, ride it'};
  if(s==='cautious_long') return {cls:'b-caution',txt:'CAUTIOUS LONG — momentum cooling'};
  return {cls:'b-off',txt:s.replace('_',' ').toUpperCase()+' — no long approval'};
}

function ladder(lv,price){
  if(!lv) return '<div class="empty">awaiting levels…</div>';
  const prox=window.PROX||1;
  const items=[{v:lv.top,cls:'top',lab:'Top · call wall'},
               {v:lv.mid,cls:'mid',lab:'Mid · gvwap'},
               {v:lv.lower,cls:'low',lab:'Lower · put wall'}];
  const vals=items.map(i=>i.v).concat(price!=null?[price]:[]);
  const pad=(Math.max(...vals)-Math.min(...vals))*0.15||1;
  const min=Math.min(...vals)-pad, max=Math.max(...vals)+pad;
  const pct=v=>Math.max(2,Math.min(98,(v-min)/(max-min)*100));
  const near=l=>price!=null&&Math.abs(price-l)<=prox;
  // True-position dashed lines.
  const lines=items.map(i=>`<div class="rung ${i.cls} ${near(i.v)?'near':''}" style="bottom:${pct(i.v)}%"></div>`).join('');
  // Labels with collision avoidance so near-coincident levels don't overlap.
  const labs=items.map(i=>({...i,pos:pct(i.v)})).sort((a,b)=>a.pos-b.pos);
  const GAP=13;
  for(let k=1;k<labs.length;k++) if(labs[k].pos-labs[k-1].pos<GAP) labs[k].pos=labs[k-1].pos+GAP;
  const labels=labs.map(i=>`<div class="rlab ${i.cls} ${near(i.v)?'near':''}" style="bottom:${i.pos}%">
      <span>${i.lab}</span><b class="mono">${fmt(i.v)}</b></div>`).join('');
  const px=price!=null?`<div class="pxmark" style="bottom:${pct(price)}%"><span class="tag mono">${fmt(price)}</span></div>`:'';
  const src=lv.expiry?`<div class="lvsrc">levels: ${lv.expiry}</div>`:'';
  return `<div class="ladder">${src}${lines}${labels}${px}</div>`;
}

function freshness(t){
  if(!t.quote||window.SRV==null) return '';
  const age=window.SRV-t.quote.asof;
  const stale=age>20;
  const err=stale&&t.quote_error?` title="${t.quote_error}"`:'';
  return `<span class="fresh ${stale?'stale':''}"${err}>${age<2?'live':Math.round(age)+'s ago'}</span>`
    +(stale&&t.quote_error?`<span class="muted" style="font-size:10px;margin-left:6px">feed: ${t.quote_error}</span>`:'');
}

function flow(mm){
  if(!mm) return '';
  const pb=mm.puts_below_spot||0, ca=mm.calls_at_above_spot||0;
  const mx=Math.max(pb,ca,1);
  const bull=mm.bull_control;
  return `<div class="flow">
    <div class="flowrow"><span class="lbl">Puts below spot</span>
      <div class="bar p"><i style="width:${pb/mx*100}%"></i></div><span class="num mono">${k(pb)}</span></div>
    <div class="flowrow"><span class="lbl">Calls ≥ spot</span>
      <div class="bar c"><i style="width:${ca/mx*100}%"></i></div><span class="num mono">${k(ca)}</span></div>
    <div class="ctrl ${bull?'bull':'bear'}">${bull?'▲ BULLS IN CONTROL — flow confirms':'▼ flow not confirming (calls ≥ spot dominate)'}</div>
  </div>`;
}

function position(t){
  const p=t.position;
  if(!p){
    const lv=t.levels;
    if(t.state==='armed'&&lv) return `<div class="targets">Armed · entry trigger near lower <b>${fmt(lv.lower)}</b> · strike would be mid+$${window.SOFF||1} <b>${fmt(lv.mid+(window.SOFF||1))}</b></div>`;
    return '';
  }
  const cls=t.pnl>=0?'pnl-pos':'pnl-neg', lv=t.levels;
  const be=p.breakeven_armed?` <span class="pill2 pill-be">BE STOP @ ${fmt(p.entry_price)}</span>`:'';
  return `<div class="pos">
    <div class="row"><span>Contract</span><span class="mono">${p.contract_symbol}${be}</span></div>
    <div class="row"><span>Strike / Qty</span><span class="mono">${fmt(p.strike)} × ${p.qty}</span></div>
    <div class="row"><span>Entry → Now</span><span class="mono">${fmt(p.entry_price)} → ${fmt(p.current_price)}</span></div>
    <div class="row"><span>P&amp;L</span><span class="mono ${cls}">${money(t.pnl)} (${fmt(t.pnl_pct,1)}%)</span></div>
    ${lv?`<div class="targets">Exit: top <b>${fmt(lv.top)}</b> · mid <b>${fmt(lv.mid)}</b> (downgrade) · stop&lt; <b>${fmt(lv.lower)}</b>${p.breakeven_armed?` · <b>breakeven ${fmt(p.entry_price)}</b>`:''}</div>`:''}
  </div>`;
}

function card(t){
  const b=statusBanner(t.mm);
  const stCls=t.state==='open'?'st-open':t.state==='armed'?'st-armed':'st-disabled';
  return `<div class="card ${t.state==='open'?'open':''}">
    <div class="chead">
      <span class="tkr">${t.ticker}</span>
      <span class="state-pill ${stCls}">${t.state}</span>
      <div class="spacer"></div>
      <span class="price mono">${t.quote?fmt(t.quote.last):'—'}</span>
      ${freshness(t)}
    </div>
    <div class="banner ${b.cls}">${b.txt}</div>
    ${ladder(t.levels,t.quote?t.quote.last:null)}
    ${flow(t.mm)}
    ${position(t)}
    <div class="events">${(t.events||[]).map(e=>{const i=e.indexOf(' ');return `<div><span class="mono">${e.slice(0,8)}</span> ${e.slice(8)}</div>`;}).join('')||'<div class="muted">no events yet</div>'}</div>
  </div>`;
}

function render(s){
  window.gammaSnap=s;
  window.PROX=s.proximity;
  window.SOFF=s.strike_offset;
  window.SRV=s.server_time;
  window.gammaSrc=(s.mode==='live'?`· data: ${s.market_data_provider}`:'· data: mock');

  const openCount=s.tickers.filter(t=>t.state==='open').length;
  const sm=s.summary;
  const stat=(kk,v,cls='')=>`<div class="stat"><div class="k">${kk}</div><div class="v ${cls}">${v}</div></div>`;
  document.getElementById('summary').innerHTML=
    stat("Today P&L",money(sm.today_pnl),sm.today_pnl>=0?'pnl-pos':'pnl-neg')+
    stat("Realized P&L",money(sm.realized_pnl),sm.realized_pnl>=0?'pnl-pos':'pnl-neg')+
    stat("Win Rate",sm.win_rate+'%')+
    stat("Closed Trades",sm.closed_trades)+
    stat("Open Positions",openCount,openCount?'pnl-pos':'');

  const et=sm.exit_types||{};
  const etStr=Object.keys(et).map(k=>`${k}×${et[k]}`).join('  ');
  document.getElementById('exitTypes').textContent=
    (etStr?etStr+'   ·   ':'')+
    `avg win ${money(sm.avg_win)} / loss ${money(sm.avg_loss)}   ·   hold ${sm.avg_hold_min||0}m`;

  document.getElementById('cards').innerHTML=s.tickers.map(card).join('');

  const tb=document.getElementById('tlog');
  if(!s.trades.length){tb.innerHTML='<tr><td colspan="9" class="empty">No trades yet</td></tr>';}
  else tb.innerHTML=s.trades.map(t=>{
    const time=new Date(t.ts*1000).toLocaleTimeString();
    const pnl=t.pnl==null?'—':`<span class="${t.pnl>=0?'pnl-pos':'pnl-neg'} mono">${money(t.pnl)}</span>`;
    return `<tr><td class="mono muted">${time}</td><td><b>${t.ticker}</b></td>
      <td class="tag-${t.action.toLowerCase()}">${t.action}</td>
      <td class="mono">${t.contract_symbol}</td><td class="mono">${fmt(t.strike)}</td>
      <td class="mono">${t.qty}</td><td class="mono">${fmt(t.price)}</td><td>${pnl}</td>
      <td class="muted">${t.exit_type?`<b style="color:var(--txt)">${t.exit_type}</b> · `:''}${t.reason}${t.mfe!=null?` <span class="muted">[mfe ${money(t.mfe)} / mae ${money(t.mae)}${t.hold_seconds!=null?', '+(t.hold_seconds/60).toFixed(1)+'m':''}]</span>`:''}${t.dry_run?' <span class="mini">DRY</span>':''}</td></tr>`;
  }).join('');
}

// ---- Person's Pivots tab ----
function pivotRegime(s){
  const el=document.getElementById('pivotRegime');
  const vix=s.vix_last!=null?`  ·  VIX ${fmt(s.vix_last)}`:'';
  el.className='banner zoneinfo';
  const tf=(s.timeframe||'weekly').toUpperCase();
  el.textContent=`ZONE FADE (${tf} pivots) — into a zone from BELOW → short puts · from ABOVE → long calls  ·  `
    +`${s.contracts} ATM, scale to 1 runner @ +50%, runner exits at the next zone${vix}`;
}

function pivotLadder(pv,price,zoneW){
  if(!pv) return '<div class="empty">awaiting pivots…</div>';
  const half=(zoneW||0)/2;
  const items=[{v:pv.r3,cls:'res',lab:'R3'},{v:pv.r2,cls:'res',lab:'R2'},{v:pv.r1,cls:'res key',lab:'R1'},
    {v:pv.pp,cls:'piv key',lab:'PP'},
    {v:pv.s1,cls:'sup key',lab:'S1'},{v:pv.s2,cls:'sup',lab:'S2'},{v:pv.s3,cls:'sup',lab:'S3'}];
  // include zone edges in the range so bands aren't clipped
  const vals=items.flatMap(i=>[i.v-half,i.v+half]).concat(price!=null?[price]:[]);
  const pad=(Math.max(...vals)-Math.min(...vals))*0.08||1;
  const min=Math.min(...vals)-pad,max=Math.max(...vals)+pad;
  const pct=v=>Math.max(1,Math.min(99,(v-min)/(max-min)*100));
  // shaded zone bands (price ±half), centered on each level
  const zones=half>0?items.map(i=>{
    const b=pct(i.v-half),t=pct(i.v+half);
    return `<div class="zone ${i.cls}" style="bottom:${b}%;height:${Math.max(0.8,t-b)}%"></div>`;
  }).join(''):'';
  const lines=items.map(i=>`<div class="rung ${i.cls}" style="bottom:${pct(i.v)}%"></div>`).join('');
  const labs=items.map(i=>({...i,pos:pct(i.v)})).sort((a,b)=>a.pos-b.pos);
  const GAP=11;
  for(let j=1;j<labs.length;j++) if(labs[j].pos-labs[j-1].pos<GAP) labs[j].pos=labs[j-1].pos+GAP;
  const labels=labs.map(i=>`<div class="rlab ${i.cls}" style="bottom:${i.pos}%"><span>${i.lab}</span><b class="mono">${fmt(i.v)}</b></div>`).join('');
  const px=price!=null?`<div class="pxmark" style="bottom:${pct(price)}%"><span class="tag mono">${fmt(price)}</span></div>`:'';
  const zn=half>0?`<div class="znote">zones ${fmt(zoneW)} wide</div>`:'';
  return `<div class="ladder" style="height:230px">${zones}${lines}${labels}${px}${zn}</div>`;
}

function pivotPosition(t){
  const p=t.position;
  if(!p){
    if(t.state==='armed')
      return `<div class="targets">Armed — into a zone from below → puts · from above → calls</div>`;
    return '';
  }
  const dirPill=p.direction==='SHORT'?'pill-short':'pill-long';
  const tot=t.total_pnl, opc=tot>=0?'pnl-pos':'pnl-neg';
  const tgt=p.target!=null?`${p.target_label} ${fmt(p.target)}`:'next zone (none)';
  const stop=p.stop_premium>=0?`${fmt(p.stop_premium)} prem`:'—';
  return `<div class="pos">
    <div class="row"><span>Position</span><span><span class="pill2 ${dirPill}">${p.direction} ${p.option_type}</span>${p.scaled?' <span class="pill2 pill-scaled">RUNNER</span>':''}${p.breakeven?' <span class="pill2 pill-be">BE</span>':''}</span></div>
    <div class="row"><span>Contract (ATM)</span><span class="mono">${p.contract_symbol}</span></div>
    <div class="row"><span>Faded zone</span><span class="mono">${p.entry_zone_label} ${fmt(p.pp)}</span></div>
    <div class="row"><span>Qty (rem / init)</span><span class="mono">${p.remaining_qty} / ${p.qty}</span></div>
    <div class="row"><span>Entry → Now</span><span class="mono">${fmt(p.entry_price)} → ${fmt(p.current_price)}</span></div>
    <div class="row"><span>Stop / Runner tgt</span><span class="mono">${stop} · ${tgt}</span></div>
    <div class="row"><span>Realized + Open</span><span class="mono ${opc}">${money(p.realized_pnl)} + ${money(t.open_pnl)} = ${money(tot)}</span></div>
    <div class="targets">Scale to runner @ +50% → breakeven → runner exits at ${tgt}</div>
  </div>`;
}

function pcard(t){
  const stCls=t.state==='open'?'st-open':t.state==='armed'?'st-armed':'st-disabled';
  return `<div class="card ${t.state==='open'?'open':''}">
    <div class="chead">
      <span class="tkr">${t.ticker}</span>
      <span class="state-pill ${stCls}">${t.state}</span>
      ${t.direction?`<span class="pill2 ${t.direction==='SHORT'?'pill-short':'pill-long'}">${t.direction}</span>`:''}
      <div class="spacer"></div>
      <span class="price mono">${t.quote?fmt(t.quote.last):'—'}</span>
      ${freshness(t)}
    </div>
    ${pivotLadder(t.pivots,t.quote?t.quote.last:null,t.zone_width)}
    ${pivotPosition(t)}
    <div class="events">${(t.events||[]).map(e=>`<div><span class="mono">${e.slice(0,8)}</span> ${e.slice(8)}</div>`).join('')||'<div class="muted">no events yet</div>'}</div>
  </div>`;
}

function renderPivot(s){
  window.pivotSnap=s; window.SRV=s.server_time;
  pivotRegime(s);
  const openCount=s.tickers.filter(t=>t.state==='open').length;
  const sm=s.summary;
  const stat=(kk,v,cls='')=>`<div class="stat"><div class="k">${kk}</div><div class="v ${cls}">${v}</div></div>`;
  document.getElementById('psummary').innerHTML=
    stat("Today P&L",money(sm.today_pnl),sm.today_pnl>=0?'pnl-pos':'pnl-neg')+
    stat("Realized P&L",money(sm.realized_pnl),sm.realized_pnl>=0?'pnl-pos':'pnl-neg')+
    stat("Win Rate",sm.win_rate+'%')+
    stat("Closed Trades",sm.closed_trades)+
    stat("Open Positions",openCount,openCount?'pnl-pos':'');
  const et=sm.exit_types||{};
  document.getElementById('pexitTypes').textContent=Object.keys(et).map(kk=>`${kk}×${et[kk]}`).join('  ');
  document.getElementById('pcards').innerHTML=s.tickers.map(pcard).join('');
  const tb=document.getElementById('ptlog');
  if(!s.trades.length){tb.innerHTML='<tr><td colspan="9" class="empty">No trades yet</td></tr>';}
  else tb.innerHTML=s.trades.map(t=>{
    const time=new Date(t.ts*1000).toLocaleTimeString();
    const pnl=t.pnl==null?'—':`<span class="${t.pnl>=0?'pnl-pos':'pnl-neg'} mono">${money(t.pnl)}</span>`;
    return `<tr><td class="mono muted">${time}</td><td><b>${t.ticker}</b></td>
      <td class="tag-${t.action.toLowerCase()}">${t.action}</td>
      <td class="mono">${t.contract_symbol}</td><td class="mono">${fmt(t.strike)}</td>
      <td class="mono">${t.qty}</td><td class="mono">${fmt(t.price)}</td><td>${pnl}</td>
      <td class="muted">${t.exit_type?`<b style="color:var(--txt)">${t.exit_type}</b> · `:''}${t.reason}${t.dry_run?' <span class="mini">DRY</span>':''}</td></tr>`;
  }).join('');
}

async function refresh(){
  try{const r=await fetch('/api/state');render(await r.json());}catch(e){}
  try{const r=await fetch('/api/pivot/state');renderPivot(await r.json());}catch(e){}
  updateHeader();
}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString(),1000);
setInterval(refresh,2000);
refresh();
</script>
